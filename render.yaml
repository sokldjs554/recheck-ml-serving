services:
  - type: web
    name: recheck-ml-serving
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/serve_demo.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////tmp/recheck-demo.db
      - key: MODEL_SERVICE_URL
        value: http://127.0.0.1:8001
