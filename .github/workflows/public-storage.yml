name: Public PostgreSQL persistence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-storage.yml'
      - 'scripts/verify_public_storage.py'
      - 'scripts/verify_public_observations.py'
      - 'docs/evidence/public-storage-fixture.json'
permissions:
  contents: read
concurrency:
  group: public-storage
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Select a fixture within the demo session lifetime
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os
          p = Path('docs/evidence/public-storage-fixture.json')
          age = (datetime.now(timezone.utc)-datetime.fromisoformat(json.loads(p.read_text())['captured_at'])).total_seconds() if p.exists() else 3600
          mode = 'verify' if 0 <= age < 3000 else 'capture'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('RECHECK_STORAGE_MODE=' + mode + '\n')
          PY
      - name: Wait for persistent public API
        run: |
          python - <<'PY'
          import time, httpx
          import json, os
          from pathlib import Path
          fixture = Path('docs/evidence/public-storage-fixture.json')
          previous = json.loads(fixture.read_text())['boot_id'] if os.environ['RECHECK_STORAGE_MODE'] == 'verify' else None
          until = time.monotonic() + 480
          while time.monotonic() < until:
              try:
                  r = httpx.get('https://recheck-ml-serving.onrender.com/api/operations', timeout=90)
                  if r.status_code == 200 and r.json().get('storage') == 'postgresql' and r.json().get('samples') and r.json()['samples'][-1]['boot_id'] != previous:
                      break
              except (httpx.HTTPError, ValueError):
                  pass
              time.sleep(10)
          else:
              raise SystemExit('PostgreSQL observer not ready')
          PY
      - name: Capture or verify persisted action across deployments
        run: |
          mkdir -p evidence
          if [ "$RECHECK_STORAGE_MODE" = verify ]; then
            python scripts/verify_public_storage.py --base https://recheck-ml-serving.onrender.com --mode verify --fixture docs/evidence/public-storage-fixture.json --output evidence/public-storage-verification.json
          else
            python scripts/verify_public_storage.py --base https://recheck-ml-serving.onrender.com --mode capture --fixture evidence/public-storage-fixture.json --output evidence/public-storage-capture.json
          fi
      - name: Verify public failure and recovery observations
        run: python scripts/verify_public_observations.py --base https://recheck-ml-serving.onrender.com --output evidence/public-observations-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-storage-proof
          path: evidence/
          retention-days: 90
