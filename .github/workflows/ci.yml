name: RECHECK verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recheck
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: recheck
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U recheck'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
          RECHECK_TEST_DATABASE_URL: postgresql+psycopg://recheck:local-demo-only@127.0.0.1:5432/recheck
          RECHECK_NETWORK_TESTS: '1'
      - run: npm ci && npm test && npm run build
        working-directory: demo
      - run: diff -qr demo/dist web_static
      - run: python -m compileall -q scripts backend/recheck
