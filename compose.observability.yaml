# Standalone local lab. All host bindings are loopback; notifications stay local.
services:
  model:
    image: ${RECHECK_OBSERVE_IMAGE:-recheck:local}
    command: [python, -m, uvicorn, recheck.worker:app, --host, 0.0.0.0, --port, '8001']
    environment: &telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_BSP_SCHEDULE_DELAY: '500'
      OTEL_SERVICE_NAME: recheck-worker
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      NO_PROXY: localhost,127.0.0.1,collector,jaeger,api,model,prometheus,alertmanager,alert-sink
      no_proxy: localhost,127.0.0.1,collector,jaeger,api,model,prometheus,alertmanager,alert-sink
      RECHECK_DEADLINE_MS: '1000'
    mem_limit: 512m
    cpus: 0.5
  api:
    image: ${RECHECK_OBSERVE_IMAGE:-recheck:local}
    command: [python, -m, uvicorn, recheck.api:app, --host, 0.0.0.0, --port, '8000']
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: recheck-api
      MODEL_SERVICE_URL: http://model:8001
      DATABASE_URL: sqlite:////tmp/observe.db
    ports: ['127.0.0.1:18100:8000']
    mem_limit: 512m
    cpus: 0.5
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:19090:9090']
    mem_limit: 256m
    cpus: 0.3
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --cluster.listen-address=]
    volumes: [./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ['127.0.0.1:19093:9093']
    mem_limit: 128m
    cpus: 0.2
  alert-sink:
    image: python:3.12-slim
    command: [python, /config/alert_sink.py]
    volumes: [./infra/observability/alert_sink.py:/config/alert_sink.py:ro]
    ports: ['127.0.0.1:18090:8090']
    mem_limit: 64m
    cpus: 0.1
  collector:
    image: otel/opentelemetry-collector:0.123.0
    command: [--config=/etc/otel/config.yml]
    environment:
      NO_PROXY: localhost,127.0.0.1,jaeger
      no_proxy: localhost,127.0.0.1,jaeger
    volumes: [./infra/observability/collector.yml:/etc/otel/config.yml:ro]
    mem_limit: 128m
    cpus: 0.2
  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      MEMORY_MAX_TRACES: '1000'
      NO_PROXY: localhost,127.0.0.1
    ports: ['127.0.0.1:16686:16686']
    mem_limit: 256m
    cpus: 0.3
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      NO_PROXY: localhost,127.0.0.1,prometheus,jaeger
      no_proxy: localhost,127.0.0.1,prometheus,jaeger
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboard.json:/var/lib/grafana/dashboards/recheck.json:ro
    ports: ['127.0.0.1:13000:3000']
    mem_limit: 256m
    cpus: 0.3
