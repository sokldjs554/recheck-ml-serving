services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recheck
      POSTGRES_USER: recheck
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U recheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - recheck-data:/var/lib/postgresql/data
  model:
    build: .
    image: recheck:local
    command: [python, -m, uvicorn, recheck.worker:app, --host, 0.0.0.0, --port, '8001']
    environment:
      RECHECK_WORKER_CONCURRENCY: '2'
      RECHECK_WORKER_QUEUE: '8'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    image: recheck:local
    command: [python, -m, uvicorn, 'scripts.hosted_app:app', --host, 0.0.0.0, --port, '8000']
    ports: ['127.0.0.1:${RECHECK_PORT:-8000}:8000']
    environment:
      MODEL_SERVICE_URL: http://model:8001
      DATABASE_URL: postgresql+psycopg://recheck:local-demo-only@postgres:5432/recheck
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy
    stop_grace_period: 20s
volumes:
  recheck-data:
