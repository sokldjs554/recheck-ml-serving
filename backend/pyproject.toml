[project]
name = "recheck-backend"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["recheck*"]
