global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: recheck-api
    static_configs:
      - targets: ['api:8000']
  - job_name: recheck-model
    static_configs:
      - targets: ['model:8001']
