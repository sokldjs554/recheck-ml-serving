kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd]
      snapshotter = "native"
nodes:
  - role: control-plane
    # Nested lab runtimes may have no kernel log device. OOM kernel-log watching
    # is unavailable in this lab; metrics/exit status remain visible.
    extraMounts:
      - hostPath: /dev/null
        containerPath: /dev/kmsg
        readOnly: true
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
