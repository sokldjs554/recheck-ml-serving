apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
  namespace: recheck
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: model}
  template:
    metadata:
      labels: {app: model}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: model
          image: recheck:kubernetes
          imagePullPolicy: Never
          command: [python, -m, uvicorn, 'recheck.worker:app', --host, 0.0.0.0, --port, '8001', --timeout-graceful-shutdown, '20']
          env:
            - {name: RECHECK_WORKER_CONCURRENCY, value: '1'}
            - {name: RECHECK_WORKER_QUEUE, value: '4'}
          ports:
            - containerPort: 8001
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            httpGet: {path: /ready, port: 8001}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: 8001}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /live, port: 8001}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: [python, -c, 'import time; time.sleep(5)']}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: recheck
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: recheck:kubernetes
          imagePullPolicy: Never
          command: [python, -m, uvicorn, 'scripts.hosted_app:app', --host, 0.0.0.0, --port, '8000', --timeout-graceful-shutdown, '20']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: postgres, key: DATABASE_URL}
            - {name: MODEL_SERVICE_URL, value: 'http://model:8001'}
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: [python, -c, 'import time; time.sleep(5)']}
